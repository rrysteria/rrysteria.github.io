<!doctype html>
<html lang="en-GB" data-bs-core="elegant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="View the Romilia photography portfolio and explore portrait, editorial, and portfolio services."
    />
    <title>Work | Romilia</title>

    <link
      href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css"
      rel="stylesheet"
      integrity="sha256-RjeFzczeuZHCyS+Gvz+kleETzBF/o84ZRHukze/yv6o="
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/cores/halfmoon.elegant.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link href="styles.css" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.420.0/dist/umd/lucide.min.js" defer></script>
    <script src="script.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header" data-site-header>
      <nav class="navbar navbar-expand-md" aria-label="Primary navigation">
        <div class="site-header__inner container-fluid">
          <a
            class="brand navbar-brand"
            href="index.html"
            aria-label="Romilia home"
            >ROMILIA</a
          >

          <button
            class="menu-button navbar-toggler"
            type="button"
            aria-expanded="false"
            aria-controls="primary-navigation"
            aria-label="Open the menu"
            data-menu-button
          >
            <span
              class="menu-button__icon"
              aria-hidden="true"
              data-menu-open-icon
            >
              <i class="icon" data-lucide="menu"></i>
            </span>
            <span
              class="menu-button__icon"
              aria-hidden="true"
              data-menu-close-icon
              hidden
            >
              <i class="icon" data-lucide="x"></i>
            </span>
            <span data-menu-label>Menu</span>
          </button>

          <div
            class="primary-navigation collapse navbar-collapse"
            id="primary-navigation"
            data-navigation
          >
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="index.html" aria-current="page"
                  >Portfolio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="fashion.html">Fashion</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="services.html">Services</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">Contact</a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link nav-link--social"
                  href="https://www.instagram.com/romiliawear"
                  target="_blank"
                  rel="noopener"
                  aria-label="Follow @romiliawear on Instagram (opens in a new tab)"
                >
                  <i
                    class="icon"
                    data-lucide="instagram"
                    aria-hidden="true"
                  ></i>
                  <span>@romiliawear</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main id="main-content">
      <section
        class="work-section container-fluid"
        id="home"
        aria-labelledby="work-title"
      >
        <h1 id="work-title" class="visually-hidden">
          Romilia photography portfolio
        </h1>
        <div
          class="project-grid"
          id="project-grid"
          aria-busy="true"
          data-project-grid
        >
          <div class="grid-loading" data-grid-loading>
            <span class="loading-spinner" aria-hidden="true"></span>
            <p>Loading gallery...</p>
          </div>
        </div>
      </section>
    </main>

    <div
      class="lightbox"
      id="lightbox"
      aria-hidden="true"
      aria-modal="true"
      aria-labelledby="lightbox-title"
      aria-describedby="lightbox-help"
      role="dialog"
      inert
      data-lightbox
    >
      <div
        class="lightbox__backdrop"
        aria-hidden="true"
        data-lightbox-backdrop
      ></div>
      <div class="lightbox__content" data-lightbox-content>
        <div
          class="lightbox__toolbar"
          role="toolbar"
          aria-label="Photo controls"
        >
          <div
            class="lightbox__zoom-controls"
            role="group"
            aria-label="Zoom controls"
          >
            <button
              class="lightbox__tool"
              type="button"
              aria-label="Zoom out"
              title="Zoom out"
              data-zoom-out
            >
              <span class="icon-fallback" aria-hidden="true">−</span>
              <i class="icon" data-lucide="zoom-out" aria-hidden="true"></i>
            </button>
            <output
              class="lightbox__zoom-value"
              aria-live="polite"
              data-zoom-value
              >100%</output
            >
            <button
              class="lightbox__tool"
              type="button"
              aria-label="Zoom in"
              title="Zoom in"
              data-zoom-in
            >
              <span class="icon-fallback" aria-hidden="true">+</span>
              <i class="icon" data-lucide="zoom-in" aria-hidden="true"></i>
            </button>
            <button
              class="lightbox__tool lightbox__tool--text"
              type="button"
              title="Reset zoom"
              data-zoom-reset
            >
              <i class="icon" data-lucide="rotate-ccw" aria-hidden="true"></i>
              <span>Reset</span>
            </button>
          </div>
          <button
            class="lightbox__tool lightbox__tool--text lightbox__close"
            type="button"
            title="Close viewer"
            data-lightbox-close
          >
            <i class="icon" data-lucide="x" aria-hidden="true"></i>
            <span>Close</span>
          </button>
        </div>

        <button
          class="lightbox__nav lightbox__nav--prev"
          type="button"
          aria-label="Show the previous photo"
          aria-keyshortcuts="ArrowLeft"
          title="Previous photo"
          data-lightbox-prev
        >
          <span class="icon-fallback" aria-hidden="true">‹</span>
          <i class="icon" data-lucide="chevron-left" aria-hidden="true"></i>
        </button>

        <figure class="lightbox__figure">
          <div class="lightbox__stage" data-lightbox-stage></div>
          <figcaption class="lightbox__caption">
            <div class="lightbox__caption-heading">
              <h2 id="lightbox-title" data-lightbox-title>Photo</h2>
              <output
                class="lightbox__count"
                aria-live="polite"
                data-lightbox-count
              ></output>
            </div>
            <p class="lightbox__category" data-lightbox-category></p>
            <p class="lightbox__help" id="lightbox-help">
              <span class="lightbox__help--pointer"
                >Click the photo or use the mouse wheel to zoom. Drag to move
                the photo. Use the left and right arrow keys to browse.</span
              >
              <span class="lightbox__help--touch"
                >Pinch to zoom. Drag to move the photo. Swipe to browse.</span
              >
            </p>
          </figcaption>
        </figure>

        <button
          class="lightbox__nav lightbox__nav--next"
          type="button"
          aria-label="Show the next photo"
          aria-keyshortcuts="ArrowRight"
          title="Next photo"
          data-lightbox-next
        >
          <span class="icon-fallback" aria-hidden="true">›</span>
          <i class="icon" data-lucide="chevron-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <footer class="site-footer container-fluid">
      <div>
        <p class="section-label">Start a project</p>
        <p class="site-footer__statement">Tell me what you want to create.</p>
      </div>
      <div class="site-footer__links">
        <a class="icon-link" href="contact.html">
          <span>Contact Romilia</span>
          <i class="icon" data-lucide="arrow-up-right" aria-hidden="true"></i>
        </a>
        <a class="icon-link" href="privacy.html">
          <span>Privacy notice</span>
          <i class="icon" data-lucide="shield-check" aria-hidden="true"></i>
        </a>
      </div>
      <p class="site-footer__legal">
        © <span data-current-year>2026</span> Romilia. All rights reserved. ·
        <a href="privacy.html">Privacy notice</a>
      </p>
    </footer>
  </body>
</html>
